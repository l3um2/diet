<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2E5E4E"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="감량일지"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>감량 일지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 한 손으로 쓰는 세로 한 줄 앱: 상단 바 + 섹션 블록, 숫자는 체중계 표시창처럼 모노 */
:root{
  --bg:#F3F5F2;--panel:#FFFFFF;--ink:#18211D;--sub:#5B665F;--mute:#8C968F;--line:#DDE3DD;
  --accent:#2E5E4E;--accent-soft:#E2ECE7;--deficit:#1F5FBF;--surplus:#C2362F;--deficit-soft:#E4EDFA;--surplus-soft:#FBE7E5;
  --warn:#9A6A10;--chip:#EEF1EE;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111613;--panel:#1A211D;--ink:#E7ECE8;--sub:#A3AEA7;--mute:#78837C;--line:#2C3530;
  --accent:#8CC4AE;--accent-soft:#22342C;--deficit:#7FAEF5;--surplus:#F08A82;--deficit-soft:#1B2A40;--surplus-soft:#3A1F1D;
  --warn:#E0B45A;--chip:#232B26;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613;--panel:#1A211D;--ink:#E7ECE8;--sub:#A3AEA7;--mute:#78837C;--line:#2C3530;
  --accent:#8CC4AE;--accent-soft:#22342C;--deficit:#7FAEF5;--surplus:#F08A82;--deficit-soft:#1B2A40;--surplus-soft:#3A1F1D;
  --warn:#E0B45A;--chip:#232B26;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:600px;margin:0 auto;padding-inline:14px;padding-block:0 40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:14px;gap:6px}
.top{position:sticky}
.top>*{flex-shrink:0}
.top h1{flex-shrink:1;text-align:center}
.top:has(#back)::after{content:'';width:50px;flex-shrink:0}
@media (max-width:390px){.top h1{font-size:16px}#go-check{padding:6px 8px}#back,#prev,#next{min-width:44px}#go-set{min-width:36px;padding:6px}}
.top h1{font-size:19px;font-weight:600;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{position:absolute;right:2px;bottom:-1px;font-size:11px;color:var(--mute);white-space:nowrap;pointer-events:none}
button,.btn{font:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:38px}
button:hover{border-color:var(--mute)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:500}
button.ghost{background:transparent;border-color:transparent}
button.icon{padding:6px 10px;min-width:38px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;box-sizing:border-box;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}
label.f{display:grid;gap:4px;font-size:14px;color:var(--sub)}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;margin-bottom:10px}
.sec h2{font-size:16px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px;letter-spacing:.02em}
.sec h2 .r{margin-left:auto;font-weight:400;font-size:14px;color:var(--sub)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;background:var(--chip);border:1px solid transparent;border-radius:999px;padding:6px 10px;min-height:32px;display:inline-flex;gap:6px;align-items:center}
.chip .k{font-family:var(--f-num);font-size:12px;color:var(--sub)}
.chip.added{background:var(--accent-soft);color:var(--ink)}
.chip.on{background:var(--accent);color:var(--panel)}
.chip.on .k{color:var(--panel)}
.x{border:0;background:transparent;padding:0 2px;min-height:0;color:var(--sub);font-size:15px;line-height:1}
.meal{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px}
.meal:first-of-type{border-top:0;padding-top:0}
.meal-h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500}
.meal-h .k{margin-left:auto;font-family:var(--f-num);font-size:13px;color:var(--sub)}
.picker{background:var(--bg);border-radius:10px;padding:10px;display:grid;gap:8px}
.hint{font-size:13px;color:var(--mute)}
.balance{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;text-align:center}
.balance>div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 4px}
.balance .l{font-size:13px;color:var(--sub)}
.balance .v{font-family:var(--f-num);font-size:20px;font-weight:500}
.balance .v{white-space:nowrap}
.balance .vs{font-size:12px;color:var(--sub);margin-left:2px;font-weight:400}
.neg{color:var(--deficit)}.pos{color:var(--surplus)}
.scale{display:flex;align-items:baseline;gap:6px}
.scale input{font-family:var(--f-num);font-size:28px;font-weight:500;max-width:150px;text-align:right}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{border:0;border-radius:0;min-width:38px}
.step span{min-width:64px;text-align:center;font-family:var(--f-num);font-size:14px}
.ex-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.med{flex:1;min-width:90px;align-self:stretch;flex-direction:column;gap:0;padding-block:6px;display:flex;align-items:center;justify-content:center;gap:8px}
.med.on{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--deficit)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--chip);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;top:4px;right:4px;background:var(--panel);border-radius:99px;width:26px;height:26px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:12px;text-align:center;color:var(--sub);padding-block:2px}
.cell{border:1px solid var(--line);background:var(--panel);border-radius:8px;min-height:58px;padding:4px 1px;display:grid;align-content:start;gap:1px;text-align:center;cursor:pointer;font:inherit;color:var(--ink);min-width:0}
.cell .d{font-size:12px;color:var(--sub)}
.cell .n{font-family:var(--f-num);font-size:11px;letter-spacing:-.6px;font-weight:500;overflow:hidden;white-space:nowrap}
.cell .t{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden}
.cell.blank{visibility:hidden}
.cell.today{border-color:var(--accent)}
.cell.sel{outline:2px solid var(--accent)}
.cell.def{background:var(--deficit-soft)}.cell.sur{background:var(--surplus-soft)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:15px}
.kv dt{color:var(--sub)}.kv dd{margin:0;text-align:right}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
.tbl th,.tbl td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--sub);font-weight:500}
.empty{text-align:center;color:var(--sub);padding:24px 8px}
.err{font-size:13px;color:var(--surplus)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.legend b{font-weight:500}
svg text{font-family:var(--f-num)}
.wrow{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:10px}
.wrow .wl{font-size:16px;font-weight:600}
.wrow input{font-family:var(--f-num);font-size:22px;font-weight:500;width:110px;text-align:right;min-height:40px;padding:4px 8px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
.tile{display:grid;gap:2px;text-align:left;align-content:start;padding:12px;border-radius:14px;min-height:96px;background:var(--panel)}
.tile .tl{font-size:15px;font-weight:600;color:var(--sub)}
.tile .tv{font-size:24px;font-weight:500;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tv small,.tile .tv small{font-size:14px;color:var(--sub);margin-left:2px}
.tile .ts{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.45}
.coach{gap:8px}
.coach .rt{border-top:1px solid var(--line);padding-top:8px;display:grid;gap:6px}
.rl{margin:0;padding-left:18px;display:grid;gap:4px;font-size:15px}
.rl b{font-weight:500}
.rl li.ok{color:var(--accent)}.rl li.ok::after{content:" ✓"}
.adv{margin:0;font-size:14px;color:var(--sub);background:var(--bg);border-radius:10px;padding:8px 10px}
.tile.done .tl{color:var(--accent)}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:6px}
.mc{display:grid;gap:2px;text-align:center}
.mc .ml{font-size:14px;color:var(--sub);white-space:nowrap}
.mc .mt{font-size:17px;font-weight:500;color:var(--mute);white-space:nowrap}
.mc.on .mt{color:var(--accent)}
.tile.done .tl::after{content:" ✓"}
.tile.open,.sub3 button.open{border:2px solid var(--accent);background:var(--accent-soft)}
.panel{border:2px solid var(--accent)}
.sub3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.sub3 button{min-height:48px;font-size:15px;font-weight:500}
.alarms{display:grid;gap:6px;margin-bottom:10px}
.alarm{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);padding:2px 4px}
.alarm.due{background:var(--surplus-soft);color:var(--ink);border-radius:12px;padding:8px 10px;font-size:15px}
.alarm .at{font-weight:500}
.alarm .al{flex:1;min-width:0}
.alarm.due button.primary{background:var(--surplus);border-color:var(--surplus)}
#back,#prev,#next{font-size:30px;line-height:1;min-width:50px;min-height:48px;padding:0 0 4px;border:1px solid var(--line);background:var(--panel);border-radius:12px}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.gal button{padding:0;border:0;aspect-ratio:1;position:relative;overflow:hidden;border-radius:6px;background:var(--chip);min-height:0;max-width:100%}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal .gd{position:absolute;left:4px;bottom:4px;font-size:11px;background:rgba(0,0,0,.55);color:#fff;padding:1px 6px;border-radius:4px}
.viewer{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;color:#fff}
.vbar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px}
.vbar .vc{flex:1;font-size:15px}
.vbar button{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.vtrack{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior:contain}
.vtrack::-webkit-scrollbar{display:none}
.vslide{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;min-width:0}
.vslide img{max-width:100%;max-height:100%;object-fit:contain}
.vnav{display:flex;gap:8px;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.vnav button{flex:1;background:transparent;color:#fff;border-color:rgba(255,255,255,.35);font-size:20px}
.acc:not(.open)>*:not(.acch){display:none}
.acc .acch{cursor:pointer;min-height:28px}
.acc .acch::after{content:"▾";margin-left:8px;color:var(--mute);font-size:14px;transition:transform .15s}
.acc .acch .r+*,.acc .acch{user-select:none}
.acc.open .acch::after{transform:rotate(180deg)}
.acc .acch:not(:has(.r))::after{margin-left:auto}
.acc:not(.open){padding-block:14px}
.medf{display:grid;gap:8px}
label.ck{display:flex;align-items:center;gap:8px;font-size:15px;min-height:32px}
label.ck input{width:20px;height:20px;min-height:0;accent-color:var(--accent)}
.medf .sub label.ck{font-size:14px;color:var(--sub)}
.tiles>.tile:last-child:nth-child(odd){grid-column:1/-1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
var DOW=['일','월','화','수','목','금','토'];
var CARDIO={'걷기':3.5,'빠르게 걷기':4.3,'러닝':8.0,'실내자전거':6.8,'등산':6.0,'수영':7.0,'계단 오르기':8.0,'줄넘기':10.0};
var MEALS=[['b','아침'],['l','점심'],['d','저녁'],['s','간식']];
/* 근력 운동 기본 목록: [부위, 이름, 기준 횟수(플랭크는 초), 기준 횟수 1세트 소모 kcal(체중 70kg 기준)] */
var EXLIB0=[['하체','바벨 스쿼트',12,8],['하체','레그 프레스',12,7],['하체','런지',12,7],['하체','레그 익스텐션',12,4],['하체','레그 컬',12,4],['하체','힙 쓰러스트',12,6],['하체','이너·아웃 타이',15,4],['하체','카프 레이즈',20,3],
['등','데드리프트',10,9],['등','랫풀다운',12,5],['등','시티드 로우',12,5],['등','턱걸이(어시스트)',8,6],['등','백 익스텐션',15,4],
['가슴','벤치프레스',10,6],['가슴','체스트 프레스 머신',12,5],['가슴','펙덱 플라이',12,4],['가슴','푸시업',15,5],
['어깨·팔','숄더 프레스',10,5],['어깨·팔','사이드 레터럴 레이즈',15,3],['어깨·팔','바이셉 컬',12,3],['어깨·팔','트라이셉스 푸시다운',12,3],
['복근','윗몸일으키기',20,4],['복근','크런치',20,3],['복근','레그 레이즈',15,4],['복근','행잉 레그 레이즈',10,5],['복근','플랭크',60,4],['복근','러시안 트위스트',20,4],
['전신','버피',10,10],['전신','케틀벨 스윙',15,8],['전신','마운틴 클라이머',30,6]].map(function(x){return {part:x[0],name:x[1],reps:x[2],kcal:x[3],unit:x[1]==='플랭크'?'초':'회'}});
var COF0=[{name:'아이스 아메리카노',kcal:10,caf:150,ml:300},{name:'아메리카노',kcal:10,caf:150,ml:350},{name:'콜드브루',kcal:10,caf:200,ml:300},{name:'디카페인 아메리카노',kcal:10,caf:10,ml:350},{name:'카페라떼',kcal:180,caf:75,ml:350},{name:'바닐라 라떼',kcal:250,caf:75,ml:350},{name:'믹스커피',kcal:50,caf:50,ml:150}];
function protOf(d){return MEALS.reduce(function(a,m){return a+(d.meals[m[0]]||[]).reduce(function(s,x){return s+(+x.prot||0)},0)},0)}
function protGoal(){var p=S.prof||{};if(p.protGoal)return p.protGoal;var w=p.goal||weightFor(today())||70;return Math.round(w*1.4/5)*5}
function cofMlOf(c){if(c.ml!=null)return +c.ml||0;var L=(S.prof&&S.prof.cofLib)||[];var f=L.find(function(x){return x.name===c.name})||COF0.find(function(x){return x.name===c.name});return f&&f.ml!=null?+f.ml:300}
function cofMl(d){return (d.coffee||[]).reduce(function(a,c){return a+cofMlOf(c)},0)}
function waterTot(d){return (d.waterMl||0)+cofMl(d)}
function exLib(){return (S.prof&&S.prof.exLib)||EXLIB0}
function cofLib(){return (S.prof&&S.prof.cofLib)||COF0}
var BSLOT=[['m','아침'],['l','점심'],['d','저녁']];
var INJ={mounjaro:{name:'마운자로',doses:[2.5,5,7.5,10,12.5,15]},wegovy:{name:'위고비',doses:[0.25,0.5,1,1.7,2.4]}};
var WD=['일','월','화','수','목','금','토'],SITES=['배 왼쪽','배 오른쪽','허벅지 왼쪽','허벅지 오른쪽','팔 왼쪽','팔 오른쪽'],SX=['메스꺼움','구토','설사','변비','속쓰림','복통','두통','피로'];
function medCfg(){var p=S.prof||{};if(p.medSetup)return p.medSetup;if(p.mj)return {none:false,bor:{on:false,slots:[]},blue:false,inj:{type:'mounjaro',day:p.mj.day,dose:p.mj.dose}};return {none:false,bor:{on:true,slots:['l','d']},blue:true,inj:null}}
function borSlots(){var c=medCfg();return c.bor&&c.bor.on?BSLOT.filter(function(s){return (c.bor.slots||[]).indexOf(s[0])>=0}):[]}
function injCfg(){var c=medCfg();return c.inj&&INJ[c.inj.type]?c.inj:null}
function injName(t){var i=t?{type:t}:injCfg();return i&&INJ[i.type]?INJ[i.type].name:'주사'}
function anyMed(){return !!(borSlots().length||medCfg().blue||injCfg())}
function medLabel(){var c=medCfg(),a=[];if(borSlots().length)a.push('보령 '+borSlots().length+'회');if(c.blue)a.push('파란약');if(injCfg())a.push(injName());return a.length?a.join(' · '):'없음'}
function medT(m){return m?(typeof m==='object'?m.t:m):null}
function medNo(m){return m&&typeof m==='object'?m.no:null}

function pad(n){return (n<10?'0':'')+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return iso(new Date())}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function label(s){var d=parse(s);return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DOW[d.getDay()]+')'}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function r0(n){return Math.round(n)}
function f1(n){return (Math.round(n*10)/10).toFixed(1)}
function sgn(n){return (n>0?'+':'')+r0(n).toLocaleString('ko-KR')}
function clone(o){return JSON.parse(JSON.stringify(o))}

function blankDay(date){return {date:date,weight:null,meals:{b:[],l:[],d:[],s:[]},waterMl:0,meds:{l:null,d:null,b:null},cardio:[],strength:[],coffee:[],photos:[],memo:''}}
function getDay(date){if(!S.days[date])S.days[date]=blankDay(date);var d=S.days[date];d.meals=d.meals||{b:[],l:[],d:[]};MEALS.forEach(function(m){d.meals[m[0]]=d.meals[m[0]]||[]});d.meds=d.meds||{l:null,d:null};d.cardio=d.cardio||[];d.strength=d.strength||[];d.coffee=d.coffee||[];d.photos=d.photos||[];return d}
function hasData(d){return d&&(d.weight||d.waterMl||(d.cardio&&d.cardio.length)||(d.strength&&d.strength.length)||(d.photos&&d.photos.length)||(d.coffee&&d.coffee.length)||d.memo||(d.meds&&(d.meds.m||d.meds.l||d.meds.d||d.meds.b))||d.inj||(d.fx&&(d.fx.ap||(d.fx.sx&&d.fx.sx.length)))||mealCount(d))}
function mealCount(d){if(!d||!d.meals)return 0;return MEALS.reduce(function(a,m){return a+(d.meals[m[0]]||[]).length},0)}

function inbodyFor(date){var ib=(S.prof&&S.prof.inbody)||[];var best=null;ib.forEach(function(x){if(x.date<=date&&(!best||x.date>best.date))best=x});if(!best&&ib.length){best=ib.slice().sort(function(a,b){return a.date<b.date?-1:1})[0]}return best}
function weightFor(date){var d=S.days[date];if(d&&d.weight)return d.weight;var keys=Object.keys(S.days).filter(function(k){return k<=date&&S.days[k].weight}).sort();if(keys.length)return S.days[keys[keys.length-1]].weight;var ib=inbodyFor(date);return ib?ib.weight:70}
function intake(d){return MEALS.reduce(function(a,m){return a+(d.meals[m[0]]||[]).reduce(function(s,x){return s+(+x.kcal||0)},0)},0)+(d.coffee||[]).reduce(function(a,c){return a+(+c.kcal||0)},0)}
function caffeine(d){return (d.coffee||[]).reduce(function(a,c){return a+(+c.caf||0)},0)}
function cardioKcal(c,w){return Math.max(0,(CARDIO[c.type]||4)-1)*w*(c.min/60)}
function strengthKcal(s,w){var e=findEx(s.name);if(!e)return 4*w*(3/60)*s.sets;var reps=+s.reps||e.reps;return e.kcal*(w/70)*(reps/e.reps)*s.sets}
function exKcal(d){var w=weightFor(d.date);var a=0;d.cardio.forEach(function(c){a+=cardioKcal(c,w)});d.strength.forEach(function(s){a+=strengthKcal(s,w)});return a}
function burn(d){var ib=inbodyFor(d.date);var bmr=ib?ib.bmr:0;var act=(S.prof&&S.prof.activity)||1.2;return {bmr:bmr,base:bmr*act,ex:exKcal(d),total:bmr*act+exKcal(d)}}
function dayFrac(){var n=new Date();return (n.getHours()*60+n.getMinutes())/1440}
function burnNow(bal,isToday){return isToday?bal.b.base*dayFrac()+bal.b.ex:bal.out}
function balNow(k){var b=balance(k);if(k===today()){var o=burnNow(b,true);b.out=o;b.net=b.inK-o}return b}
function balance(d){d=getDayRO(d);var i=intake(d),b=burn(d);return {inK:i,out:b.total,net:i-b.total,b:b,mealsLogged:mealCount(d)>0}}

function exMin(d){return (d.cardio||[]).reduce(function(a,c){return a+(+c.min||0)},0)}

var saving={},pending={},timers={};
function setStatus(t){var el=document.getElementById('status');if(el)el.textContent=t}
function queueSave(key,delay){clearTimeout(timers[key]);S.dirty[key]=true;setStatus('저장 중');timers[key]=setTimeout(function(){flush(key)},delay==null?700:delay)}
function writeKey(key,body){if(S.mode==='local')return idbTx('kv','readwrite',function(os){return os.put(body,key==='profile'?'profile':'day:'+key)});
  var pref=S.db.doc('data/users/'+S.uid+'/profile');return (key==='profile'?pref:pref.collection('days').doc(key)).set(body)}
function flush(key){if(saving[key]){pending[key]=true;return}saving[key]=true;var body;
  if(key==='profile'){body=clone(S.prof)}
  else{body=clone(S.days[key]);body.updatedAt=new Date().toISOString()}
  writeKey(key,body).then(function(){saving[key]=false;if(pending[key]){pending[key]=false;flush(key)}else{S.dirty[key]=false;setStatus('저장됨')}})
  .catch(function(e){saving[key]=false;S.dirty[key]=false;setStatus(e&&e.code==='quota_exceeded'?'저장 공간이 가득 찼습니다':'저장 실패, 다시 시도해 주세요')})}

/* ---------- 백업·복원 ---------- */
function blobToData(b){return new Promise(function(res){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=function(){res(null)};r.readAsDataURL(b)})}
function dataToBlob(u){var m=/^data:([^;]+);base64,(.*)$/.exec(u||'');if(!m)return null;var bin=atob(m[2]),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m[1]})}
function getPhotoBlob(id){if(S.mode==='local')return idbTx('photos','readonly',function(os){return os.get(id)});return fetch('/_blob/'+id).then(function(r){return r.ok?r.blob():null}).catch(function(){return null})}
function backup(){if(S.busy)return;if(!S.dl){S.bkErr='이 화면에서는 파일을 내려받을 수 없습니다.';S.keepScroll=true;render();return}S.busy='bk';S.bkErr='';S.keepScroll=true;render();
  var out={app:'gamryang',v:1,exportedAt:new Date().toISOString(),profile:S.prof,days:{},photos:{}};var ids=[];
  Object.keys(S.days).forEach(function(k){if(hasData(S.days[k])){out.days[k]=S.days[k];(S.days[k].photos||[]).forEach(function(id){ids.push(id)})}});
  ids.reduce(function(ch,id){return ch.then(function(){return getPhotoBlob(id)}).then(function(b){return b?blobToData(b):null}).then(function(u){if(u)out.photos[id]=u})},Promise.resolve())
  .then(function(){return S.dl.save({filename:'감량일지_백업_'+today()+'.json',data:new Blob([JSON.stringify(out)],{type:'application/json'})})})
  .then(function(){S.busy=null;touchProf(function(p){p.lastBackup=today()},true)})
  .catch(function(){S.busy=null;S.bkErr='백업 파일을 만들지 못했습니다. 다시 시도해 주세요.';S.keepScroll=true;render()})}
function restore(){if(S.busy)return;var d=S.restore.data;S.busy='rs';S.keepScroll=true;render();var map={};
  Object.keys(d.photos||{}).reduce(function(ch,id){return ch.then(function(){var b=dataToBlob(d.photos[id]);if(!b||!S.assets)return;return S.assets.upload(b,S.mode==='local'?{type:b.type,id:id}:{type:b.type}).then(function(r){map[id]=r.id}).catch(function(){})})},Promise.resolve())
  .then(function(){var keys=Object.keys(d.days||{});S.prof=clone(d.profile);
    keys.forEach(function(k){var day=clone(d.days[k]);day.photos=(day.photos||[]).map(function(id){return map[id]}).filter(Boolean);S.days[k]=day});
    return ['profile'].concat(keys).reduce(function(ch,k){return ch.then(function(){var b=k==='profile'?clone(S.prof):clone(S.days[k]);return writeKey(k,b)})},Promise.resolve())})
  .then(function(){S.busy=null;S.restore=null;S.bkErr='';if(S.view==='setup')S.view='today';setStatus('복원 완료');S.keepScroll=true;render()})
  .catch(function(){S.busy=null;S.setErr=S.bkErr='복원 중 문제가 생겼습니다. 일부만 복원되었을 수 있으니 다시 시도해 주세요.';S.keepScroll=true;render()})}

/* ---------- 휴대폰 로컬 저장 (IndexedDB) ---------- */
var IDB=null,PURL={};
function idbOpen(){return new Promise(function(res,rej){if(!window.indexedDB){rej(0);return}var r=indexedDB.open('gamryang-diary',1);r.onupgradeneeded=function(){var d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};r.onblocked=function(){rej(0)}})}
function idbTx(store,mode,fn){return new Promise(function(res,rej){var tx=IDB.transaction(store,mode),q=fn(tx.objectStore(store)),out;if(q)q.onsuccess=function(){out=q.result};tx.oncomplete=function(){res(out)};tx.onerror=function(){rej(tx.error)};tx.onabort=function(){rej(tx.error)}})}
function idbAll(){return new Promise(function(res,rej){var tx=IDB.transaction('kv','readonly'),c=tx.objectStore('kv').openCursor(),out={};c.onsuccess=function(){var cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}};tx.oncomplete=function(){res(out)};tx.onerror=function(){rej(tx.error)}})}
var localAssets={upload:function(b,o){var id=(o&&o.id)||('p'+Date.now().toString(36)+Math.random().toString(36).slice(2,8));return idbTx('photos','readwrite',function(os){return os.put(b,id)}).then(function(){PURL[id]=URL.createObjectURL(b);return {id:id}})},
  delete:function(id){if(PURL[id])URL.revokeObjectURL(PURL[id]);delete PURL[id];return idbTx('photos','readwrite',function(os){return os.delete(id)})}};
var localDl={save:function(o){var b=o.data instanceof Blob?o.data:new Blob([o.data]);var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);return Promise.resolve()}};
var BLANK='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
function imgTag(id,alt){var src;if(S.mode!=='local')src='/_blob/'+esc(id);else if(PURL[id])src=PURL[id];else{src=BLANK;if(PURL[id]!==false){PURL[id]=false;idbTx('photos','readonly',function(os){return os.get(id)}).then(function(b){if(!b)return;PURL[id]=URL.createObjectURL(b);Array.prototype.forEach.call(document.querySelectorAll('img[data-pid="'+id+'"]'),function(im){im.src=PURL[id]})})}}
  return '<img src="'+src+'" data-pid="'+esc(id)+'" alt="'+esc(alt)+'" loading="lazy">'}
function startLocal(){idbOpen().then(function(db){IDB=db;S.mode='local';S.assets=localAssets;S.dl=localDl;if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});return idbAll()})
  .then(function(all){S.prof=all.profile||null;Object.keys(all).forEach(function(k){if(k.indexOf('day:')===0)S.days[k.slice(4)]=all[k]});S.profLoaded=true;if(!S.prof)S.view='setup';render()})

function start(){if(!window.claude||!window.claude.use){startLocal();return}
  Promise.all([claude.use('db'),claude.use('user')]).then(function(r){S.db=r[0];var user=r[1];if(!S.db||!user)return null;return user.id()}).then(function(uid){
    if(!uid){S.db=null;startLocal();return}S.uid=uid;S.mode='cloud';
    var pref=S.db.doc('data/users/'+uid+'/profile');
    pref.onSnapshot(function(s){if(S.dirty.profile)return;S.prof=s.exists?clone(s.data()):null;S.profLoaded=true;if(!S.prof)S.view='setup';softRender()},function(){S.profLoaded=true;render()});
    pref.collection('days').limit(1000).onSnapshot(function(snap){var changedCur=false;snap.docChanges().forEach(function(c){var id=c.doc.id;if(S.dirty[id])return;if(c.type==='removed')delete S.days[id];else S.days[id]=clone(c.doc.data());if(id===S.date)changedCur=true});if(S.view!=='today'||changedCur)softRender()});
    claude.use('assets').then(function(a){S.assets=a;if(S.view==='today')softRender()});
    claude.use('downloads').then(function(d){S.dl=d;if(S.view==='check')softRender()});
  }).catch(function(){S.db=null;startLocal()})}
function softRender(){var a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&app.contains(a)&&S.view!=='setup')return;S.keepScroll=true;render()}
(function(){var sx=0,sy=0,st=0,tr=false,lock=null;
  function ok(e){return S.view==='today'&&S.prof&&!S.viewer&&!e.target.closest('input,textarea,select,.vtrack')}
  app.addEventListener('touchstart',function(e){if(!ok(e)||e.touches.length!==1){tr=false;return}var t=e.touches[0];var W=window.innerWidth;if(t.clientX<28||t.clientX>W-28){tr=false;return}sx=t.clientX;sy=t.clientY;st=Date.now();tr=true;lock=null},{passive:true});
  app.addEventListener('touchmove',function(e){if(!tr)return;var t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(lock==null&&(Math.abs(dx)>12||Math.abs(dy)>12))lock=Math.abs(dx)>Math.abs(dy)*1.5?'x':'y';if(lock==='x'){app.style.transform='translateX('+Math.max(-60,Math.min(60,dx*0.35))+'px)';app.style.opacity=String(1-Math.min(0.35,Math.abs(dx)/600))}},{passive:true});
  app.addEventListener('touchend',function(e){if(!tr)return;tr=false;var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;app.style.transition='transform .15s,opacity .15s';app.style.transform='';app.style.opacity='';setTimeout(function(){app.style.transition=''},160);
    if(lock==='x'&&Math.abs(dx)>=90&&Math.abs(dx)>Math.abs(dy)*2){S.date=addDays(S.date,dx<0?1:-1);S.follow=S.date===today();S.openMeal=null;S.keepScroll=false;render()}},{passive:true});
  app.addEventListener('touchcancel',function(){tr=false;app.style.transform='';app.style.opacity=''},{passive:true});
})();
S.follow=true;

document.addEventListener('visibilitychange',function(){if(!document.hidden)rollDay()});window.addEventListener('focus',rollDay);setInterval(rollDay,60000);
setInterval(function(){var e=document.querySelector('[data-burnnow]');if(!e||S.view!=='today'||S.date!==today())return;e.textContent=r0(burnNow(balance(getDayRO(S.date)),true)).toLocaleString('ko-KR')},60000);
render();start();
